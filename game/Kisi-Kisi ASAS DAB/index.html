@keyframes wiggle{
  0%,100%{
    transform:rotate(-5deg) scale(1)
  }

  50%{
    transform:rotate(6deg) scale(1.12)
  }
}

@keyframes bounceSoft{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-10px)
  }
}

@keyframes popIn{
  from{
    transform:scale(.7);
    opacity:0
  }

  to{
    transform:scale(1);
    opacity:1
  }
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0);
    opacity:1
  }

  100%{
    transform:translateY(360px) rotate(300deg);
    opacity:.1
  }
}

@keyframes floatY{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

.dice-anim{
  animation:wiggle .16s infinite
}

.bounce-soft{
  animation:bounceSoft 1.1s ease-in-out infinite
}

.pop-in{
  animation:popIn .35s ease both
}

.float-y{
  animation:floatY 2.4s ease-in-out infinite
}

.confetti{
  position:absolute;
  top:0;
  font-size:28px;
  animation:fall 2.6s ease-in forwards;
  pointer-events:none
}
