<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asesmen Akhir Semester 1</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    .breadcrumb {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    .breadcrumb a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.75rem;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .header p {
      color: #475569;
      font-size: 1rem;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .menu-card {
      display: block;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .menu-card:hover {
      border-color: #0284c7;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
    }

    .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0284c7;
      background: #e0f2fe;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .menu-card h2 {
      font-size: 1.2rem;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .menu-card p {
      font-size: 0.9rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">
      <a href="../index.html">Dashboard</a> / <span>ASAS 1</span>
    </div>

    <div class="header">
      <h1>ASAS 1</h1>
      <p>Silakan pilih Materi Pelajaran yang akan anda pelajari.</p>
    </div>

    <div class="menu-grid">
      <a href="Asesmen Akhir Semester 1/index.html" class="menu-card">
        <span class="tag">Art</span>
        <h2>Art</h2>
        <p>Art Material for Second Grade.</p>
      </a>

    </div>
  </div>
</body>
</html>
